[platformio]
default_envs = esp32-s3-devkitc-1
data_dir = data

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DTONEX_MDNS_NAME=\"tonex\"

lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    mathieucarbou/ESPAsyncWebServer @ 3.6.0
    mathieucarbou/AsyncTCP @ 3.3.2

; PIOArduino tracks Espressif's current Arduino core, including ESP32-P4.
; The official PlatformIO Espressif platform does not yet support P4.
[env:esp32-p4-wifi6-dev-kit]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4_r3-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = partitions_p4_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
extra_scripts =
    pre:scripts/patch_p4_usb_host.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DTONEX_MDNS_NAME=\"tonex\"
    -DTONEX_BOARD_P4_WIFI6=1

lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    mathieucarbou/ESPAsyncWebServer @ 3.6.0
    mathieucarbou/AsyncTCP @ 3.3.2

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
    +<tonex_hdlc.cpp>
    +<wifi_config.cpp>
build_flags =
    -std=c++17
    -DNATIVE_TEST
