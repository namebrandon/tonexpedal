name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-javascript:
    name: Run JavaScript Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

  build-firmware:
    name: Build ESP32-S3 Firmware & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run C++ Native Unit Tests
        working-directory: firmware
        run: pio test -e native

      - name: Compile ESP32-S3 Firmware
        working-directory: firmware
        run: pio run -e esp32-s3-devkitc-1
