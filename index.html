        // --- Utils ---
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- USB Serial Sync (HDLC protocol with CRC-CCITT) ---
        let serialPort = null;
        let serialReader = null;
        let rxBuffer = [];
        let rxResolve = null;
        let usbDevice = null;
        let usbEpIn = 1;
        let usbEpOut = 2;
        let usbReadAbort = null;
        let useUsb = false;

        function bytesToHex(bytes) {
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
        }

        function crcCCITT(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data[i];
                for (let j = 0; j < 8; j++) {
                    crc = (crc & 1) ? ((crc >> 1) ^ 0x8408) : (crc >> 1);
                }
            }
            return ~crc & 0xFFFF;
        }

        function stuffByte(output, byte) {
            if (byte === 0x7E || byte === 0x7D) {
                output.push(0x7D, byte ^ 0x20);
            } else {
                output.push(byte);
            }
            return 1;
        }

        function buildFrame(payload) {
            const out = [0x7E];
            for (let i = 0; i < payload.length; i++) {
                stuffByte(out, payload[i]);
            }
            const crc = crcCCITT(payload);
            stuffByte(out, crc & 0xFF);
            stuffByte(out, (crc >> 8) & 0xFF);
            out.push(0x7E);
            return new Uint8Array(out);
        }

        function deframe(frameBytes) {
            if (frameBytes.length < 4 || frameBytes[0] !== 0x7E || frameBytes[frameBytes.length - 1] !== 0x7E) {
                return null;
            }
            const unstuffed = [];
            for (let i = 1; i < frameBytes.length - 1; i++) {
                if (frameBytes[i] === 0x7D) {
                    if (i + 1 < frameBytes.length - 1) {
                        unstuffed.push(frameBytes[i + 1] ^ 0x20);
                        i++;
                    }
                } else if (frameBytes[i] === 0x7E) {
                    break;
                } else {
                    unstuffed.push(frameBytes[i]);
                }
            }
            if (unstuffed.length < 2) return null;
            const payload = new Uint8Array(unstuffed.slice(0, unstuffed.length - 2));
            const recvCrc = unstuffed[unstuffed.length - 2] | (unstuffed[unstuffed.length - 1] << 8);
            const calcCrc = crcCCITT(payload);
            if (recvCrc !== calcCrc) {
                recordDiagnosticEvent('hdlc_crc_error', {
                    frame_hex: bytesToHex(frameBytes),
                    received_crc: recvCrc,
                    calculated_crc: calcCrc
                });
                console.log('CRC mismatch:', bytesToHex(new Uint8Array([recvCrc & 0xFF, (recvCrc >> 8) & 0xFF])),
                            '!=', bytesToHex(new Uint8Array([calcCrc & 0xFF, (calcCrc >> 8) & 0xFF])));
                return null;
            }
            return payload;
        }

        function waitBytes(timeoutMs) {
            return new Promise(resolve => {
                const timer = setTimeout(() => resolve(false), timeoutMs);
                const check = () => {
                    if (rxBuffer.length > 0) {
                        clearTimeout(timer);
                        resolve(true);
                    } else {
                        rxResolve = check;
                    }
                };
                check();
            });
        }

        async function readFrame(timeoutMs) {
            let buf = [];
            const deadline = Date.now() + (timeoutMs || 3000);
            while (Date.now() < deadline) {
                const remaining = deadline - Date.now();
                if (remaining <= 0) break;
                const gotData = await waitBytes(Math.min(remaining, 2000));
                if (!gotData) break;
                while (rxBuffer.length > 0) {
                    const byte = rxBuffer.shift();
                    if (byte === 0x7E) {
                        if (buf.length > 0) {
                            buf.push(0x7E);
                            const payload = deframe(buf);
                            if (payload) {
                                recordDiagnosticEvent('hdlc_rx_frame', {
                                    frame_hex: bytesToHex(buf),
                                    payload_hex: bytesToHex(payload),
                                    payload_length: payload.length
                                });
                                console.log('RX payload:', bytesToHex(payload));
                                return payload;
                            }
                            console.log('RX bad frame, discarding');
                        }
                        buf = [0x7E];
                    } else if (buf.length > 0) {
                        buf.push(byte);
                    }
                }
            }
            recordDiagnosticEvent('hdlc_read_timeout', {
                timeout_ms: timeoutMs || 3000,
                partial_frame_hex: bytesToHex(buf)
            });
            return null;
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // --- Transport abstraction (Web Serial / WebUSB) ---
        async function transportSend(frame) {
            const transportName = useUsb ? 'webusb' : 'webserial';
            recordDiagnosticEvent('transport_tx', {
                transport: transportName,
                endpoint: useUsb ? usbEpOut : null,
                frame_hex: bytesToHex(frame),
                byte_length: frame.length
            });
            if (useUsb) {
                await usbDevice.transferOut(usbEpOut, frame);
            } else {
                const writer = serialPort.writable.getWriter();
                try { await writer.write(frame); } finally { writer.releaseLock(); }
            }
        }

        async function transportStartRead() {
            if (useUsb) {
                usbReadAbort = new AbortController();
                try {
                    while (!usbReadAbort.signal.aborted) {
                        const result = await usbDevice.transferIn(usbEpIn, 64);
                        if (result.status !== 'ok') break;
                        const data = new Uint8Array(result.data.buffer, result.data.byteOffset, result.data.byteLength);
                        recordDiagnosticEvent('transport_rx_chunk', {
                            transport: 'webusb',
                            endpoint: usbEpIn,
                            status: result.status,
                            bytes_hex: bytesToHex(data),
                            byte_length: data.length
                        });
                        for (const byte of data) rxBuffer.push(byte);
                        if (rxResolve) { const r = rxResolve; rxResolve = null; r(); }
                    }
                } catch(e) {
                    recordDiagnosticEvent('transport_read_error', { transport: 'webusb', message: e.message });
                    if (e.name !== 'AbortError') console.log('[SYNC] USB read error:', e.message);
                }
            } else {
                const reader = serialPort.readable.getReader();
                serialReader = reader;
                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) {
                            recordDiagnosticEvent('transport_rx_chunk', {
                                transport: 'webserial',
                                bytes_hex: bytesToHex(value),
                                byte_length: value.length
                            });
                            for (const byte of value) rxBuffer.push(byte);
                            if (rxResolve) { const r = rxResolve; rxResolve = null; r(); }
                        }
                    }
                } catch(e) {
                    recordDiagnosticEvent('transport_read_error', { transport: 'webserial', message: e.message });
                    console.log('[SYNC] readLoop error:', e.message);
                } finally {
                    reader.releaseLock();
                    if (serialReader === reader) serialReader = null;
                }
            }
        }

        function transportIsOpen() {
            if (useUsb) return usbDevice && usbDevice.opened;
            return serialPort && serialPort.readable;
        }

        async function transportDisconnect() {
            const transportName = useUsb ? 'webusb' : 'webserial';
            if (useUsb) {
                if (usbReadAbort) { usbReadAbort.abort(); usbReadAbort = null; }
                try { await usbDevice.close(); } catch(e) {}
                usbDevice = null;
                useUsb = false;
            } else if (serialPort) {
                if (serialReader) {
                    try { await serialReader.cancel(); } catch(e) {}
                }
                try {
                    await serialPort.close();
                } catch(e) {
                    recordDiagnosticEvent('transport_disconnect_error', { transport: 'webserial', message: e.message });
                }
                serialPort = null;
            }
            recordDiagnosticEvent('transport_disconnected', { transport: transportName });
        }

        function extractAfterMarker(data, marker) {
            for (let i = 0; i <= data.length - marker.length; i++) {
                let match = true;
                for (let j = 0; j < marker.length; j++) {
                    if (data[i + j] !== marker[j]) { match = false; break; }
                }
                if (match) return data.slice(i + marker.length);
            }
            return null;
        }

        const _nameDecoder = new TextDecoder('utf-8');
        function decodePresetName(data) {
            const str = _nameDecoder.decode(data);
            return str.replace(/\0/g, '').trim();
        }

        const HELLO_CMD = new Uint8Array([0xb9, 0x03, 0x00, 0x82, 0x04, 0x00, 0x80, 0x10, 0x01, 0xb9, 0x02, 0x02, 0x10]);
        const REQUEST_STATE_CMD = new Uint8Array([0xb9, 0x03, 0x00, 0x82, 0x06, 0x00, 0x80, 0x10, 0x03, 0xb9, 0x02, 0x81, 0x01, 0x02, 0x10]);
        const NAME_MARKER = new Uint8Array([0xB9, 0x04, 0xB9, 0x02, 0xBC, 0x21]);
        const PARAM_MARKER = new Uint8Array([0xBA, 0x03, 0xBA, 0x29]);
        const AMP_ENABLE_INDEX = 17;
        const CAB_TYPE_INDEX = 23;
        const FLOAT_SIZE = 5;
        const PRESET_RESPONSE_PREFIX = new Uint8Array([0x04, 0x10, 0xB9, 0x03, 0x01]);
        const ACTIVE_PRESET_EVENT_PREFIX = new Uint8Array([0x04, 0x02, 0xB9, 0x03, 0x00]);

        function bytesMatch(data, offset, expected) {
            if (offset + expected.length > data.length) return false;
            for (let i = 0; i < expected.length; i++) {
                if (data[offset + i] !== expected[i]) return false;
            }
            return true;
        }

        function decodePresetIndex(data) {
            const header = new Uint8Array([0xB9, 0x03, 0x81, 0x04, 0x02, 0x81]);
            if (data.length < 20 || !bytesMatch(data, 0, header)) return null;
            if (!bytesMatch(data, 7, PRESET_RESPONSE_PREFIX) &&
                !bytesMatch(data, 7, ACTIVE_PRESET_EVENT_PREFIX)) return null;

            let markerOffset = 13;
            let index = data[12];
            if (index === 0x80) {
                index = data[13];
                markerOffset = 14;
                if (index < 128) return null;
            }
            if (index >= TOTAL_PRESETS || !bytesMatch(data, markerOffset, NAME_MARKER)) return null;
            return index;
        }

        function decodePresetResponseIndex(data) {
            return bytesMatch(data, 7, PRESET_RESPONSE_PREFIX) ? decodePresetIndex(data) : null;
        }

        function decodeActivePresetEventIndex(data) {
            return bytesMatch(data, 7, ACTIVE_PRESET_EVENT_PREFIX) ? decodePresetIndex(data) : null;
        }

        function applyLocalActivePresetEvent(payload) {
            const index = decodeActivePresetEventIndex(payload);
            if (index === null) return false;
            recordDiagnosticEvent('active_preset_event', { index, source: 'local_cdc' });
            if (presetConfirmTimer && presetCommandState.pending && presetCommandState.pending.pc === index) {
                clearTimeout(presetConfirmTimer);
                presetConfirmTimer = null;
            }
            applyPresetCommandEvent({ type: 'confirmed', pc: index });
            return true;
        }

        async function readSolicitedFrame(timeoutMs, expectedPresetIndex = null) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
                const payload = await readFrame(deadline - Date.now());
                if (!payload) return null;
                if (applyLocalActivePresetEvent(payload)) continue;
                if (expectedPresetIndex !== null) {
                    const responseIndex = decodePresetResponseIndex(payload);
                    if (responseIndex === null) throw new Error('Unexpected payload while waiting for preset ' + expectedPresetIndex);
                    if (responseIndex !== expectedPresetIndex) {
                        throw new Error('Preset response ' + responseIndex + ' does not match request ' + expectedPresetIndex);
                    }
                }
                return payload;
            }
            return null;
        }

        function isCabEnabled(cabType) {
            return cabType === 0 || cabType === 1;
        }

        function readFloat32(bytes, offset) {
            if (offset + 4 > bytes.length) return null;
            const view = new DataView(new ArrayBuffer(4));
            view.setUint8(0, bytes[offset]);
            view.setUint8(1, bytes[offset + 1]);
            view.setUint8(2, bytes[offset + 2]);
            view.setUint8(3, bytes[offset + 3]);
            return view.getFloat32(0, true);
        }

        async function syncUSB() {
            const activeTransport = getActiveControlTransport();
            if (activeTransport === bridgeTransport) {
                if (bridgeSyncActive) {
                    if (bridgeSyncOwnerClientId === null || bridgeSyncOwnerClientId === bridgeClientId) {
                        activeTransport.cancelSync();
                    }
                    return;
                }

                if (!activeTransport.syncPresets()) {
                    libraryFreshness = Object.keys(state.presets).length > 0 ? 'stale' : 'empty';
                    finishBridgeSync(t('syncError') + t('bridgeDisconnected'), 0, false);
                }
                return;
            }

            return activeTransport.syncPresets();
        }

        async function syncLocalUSB() {
            const syncBtn = document.getElementById('syncUSB');
            const progressEl = document.getElementById('syncProgress');
            const fillEl = document.getElementById('syncProgressFill');
            const textEl = document.getElementById('syncProgressText');

            if (transportIsOpen()) {
                recordDiagnosticEvent('sync_cancel_requested', { transport: useUsb ? 'webusb' : 'webserial' });
                await transportDisconnect();
                syncBtn.textContent = t('syncButton');
                progressEl.classList.remove('active');
                libraryFreshness = Object.keys(state.presets).length > 0 ? 'cached' : 'empty';
                updateOperatorHealth();
                return;
            }

            // Try Web Serial first, then WebUSB fallback
            recordDiagnosticEvent('sync_started', { mode: 'local' });
            libraryFreshness = 'syncing';
            updateOperatorHealth();
            useUsb = false;
            if ('serial' in navigator) {
                try {
                    serialPort = await navigator.serial.requestPort();
                    await serialPort.open({ baudRate: 115200 });
                    const portInfo = serialPort.getInfo ? serialPort.getInfo() : {};
                    recordDiagnosticEvent('transport_connected', {
                        transport: 'webserial',
                        baud_rate: 115200,
                        usb_vendor_id: portInfo.usbVendorId || null,
                        usb_product_id: portInfo.usbProductId || null
                    });
                } catch(e) {
                    recordDiagnosticEvent('transport_connection_failed', { transport: 'webserial', message: e.message });
                    console.log('[SYNC] Web Serial failed:', e.message, '- trying WebUSB');
                    serialPort = null;
                }
            }
            if (!serialPort && 'usb' in navigator) {
                try {
                    let device = null;
                    try { device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x1963 }] }); } catch(e) {}
                    if (!device) try { device = await navigator.usb.requestDevice({ filters: [] }); } catch(e) {}
                    if (!device) throw new Error('No device selected');
                    await device.open();
                    await device.selectConfiguration(1);
                    recordDiagnosticEvent('webusb_device', describeUsbDevice(device));

                    console.log('[SYNC] Interfaces:', device.configuration.interfaces.length);
                    let cdcCtrlIface = -1;
                    let cdcDataIface = -1;
                    for (const iface of device.configuration.interfaces) {
                        for (const alt of iface.alternates) {
                            console.log('[SYNC] Iface #' + iface.interfaceNumber + ' alt#' + alt.alternateSetting + ' class=0x' + alt.interfaceClass.toString(16) + ' endpoints=' + alt.endpoints.length);
                            if (alt.interfaceClass === 0x02) cdcCtrlIface = iface.interfaceNumber;
                            if (alt.interfaceClass === 0x0A) cdcDataIface = iface.interfaceNumber;
                        }
                    }
                    if (cdcDataIface === -1) {
                        for (const iface of device.configuration.interfaces) {
                            for (const alt of iface.alternates) {
                                if (alt.endpoints.some(e => e.type === 'bulk')) {
                                    cdcDataIface = iface.interfaceNumber;
                                    break;
                                }
                            }
                            if (cdcDataIface !== -1) break;
                        }
                    }
                    if (cdcDataIface === -1) { await device.close(); throw new Error('No data interface with bulk endpoints found'); }
                    if (cdcCtrlIface !== -1) {
                        await device.claimInterface(cdcCtrlIface);
                        await device.controlTransferOut({ requestType: 'class', recipient: 'interface', request: 0x20, value: 0x00, index: cdcCtrlIface }, new Uint8Array([0x00, 0xC2, 0x01, 0x00, 0x00, 0x00, 0x08]));
                        await device.controlTransferOut({ requestType: 'class', recipient: 'interface', request: 0x22, value: 0x03, index: cdcCtrlIface });
                        console.log('[SYNC] CDC control interface', cdcCtrlIface, 'initialized');
                    }
                    await device.claimInterface(cdcDataIface);
                    const dataAlt = device.configuration.interfaces[cdcDataIface].alternates[0];
                    for (const ep of dataAlt.endpoints) {
                        if (ep.direction === 'in' && ep.type === 'bulk') usbEpIn = ep.endpointNumber;
                        if (ep.direction === 'out' && ep.type === 'bulk') usbEpOut = ep.endpointNumber;
                    }
                    console.log('[SYNC] CDC data interface', cdcDataIface, 'epIn=' + usbEpIn, 'epOut=' + usbEpOut);
                    usbDevice = device;
                    useUsb = true;
                    recordDiagnosticEvent('transport_connected', {
                        transport: 'webusb',
                        endpoint_in: usbEpIn,
                        endpoint_out: usbEpOut,
                        control_interface: cdcCtrlIface,
                        data_interface: cdcDataIface
                    });
                } catch(e) {
                    recordDiagnosticEvent('transport_connection_failed', { transport: 'webusb', message: e.message });
                    libraryFreshness = Object.keys(state.presets).length > 0 ? 'stale' : 'empty';
                    updateOperatorHealth();
                    alert(t('portError') + e.message);
                    return;
                }
            }
            if (!serialPort && !useUsb) {
                libraryFreshness = Object.keys(state.presets).length > 0 ? 'stale' : 'empty';
                updateOperatorHealth();
                alert(t('portError') + ('serial' in navigator ? '' : 'Web Serial unavailable'));
                return;
            }

            syncBtn.textContent = t('cancelSync');
            progressEl.classList.add('active');
            textEl.textContent = t('portOpening');
            fillEl.style.width = '0%';
            console.log('[SYNC] Port opened via', useUsb ? 'WebUSB' : 'Web Serial');

            rxBuffer = [];
            rxResolve = null;
            transportStartRead();

            try {
                await delay(500);
                rxBuffer = [];

                textEl.textContent = 'Hello...';
                console.log('[SYNC] Sending hello...');
                recordDiagnosticEvent('sync_phase', { phase: 'hello' });
                await transportSend(buildFrame(HELLO_CMD));
                const helloResp = await readSolicitedFrame(3000);
                recordDiagnosticEvent('sync_phase_result', { phase: 'hello', received: !!helloResp });
                console.log('[SYNC] Hello response:', helloResp ? bytesToHex(helloResp) : 'null');

                await delay(200);
                textEl.textContent = 'State...';
                console.log('[SYNC] Sending state...');
                recordDiagnosticEvent('sync_phase', { phase: 'state' });
                await transportSend(buildFrame(REQUEST_STATE_CMD));
                const stateResp = await readSolicitedFrame(3000);
                recordDiagnosticEvent('sync_phase_result', { phase: 'state', received: !!stateResp });
                console.log('[SYNC] State response:', stateResp ? bytesToHex(stateResp) : 'null');

                await delay(200);
                rxBuffer = [];

                const total = 150;
                let loaded = 0;
                let successCount = 0;

                for (let i = 0; i < total; i++) {
                    if (!transportIsOpen()) break;

                    textEl.textContent = (loaded + 1) + ' / ' + total + '...';
                    fillEl.style.width = Math.round(loaded / total * 100) + '%';

                    let presetReq;
                    if (i < 128) {
                        presetReq = new Uint8Array([
                            0xb9, 0x03, 0x81, 0x00, 0x02, 0x82, 0x06, 0x00, 0x80, 0x10, 0x03, 0xb9, 0x04, 0x10, 0x01, i, 0x00
                        ]);
                    } else {
                        presetReq = new Uint8Array([
                            0xb9, 0x03, 0x81, 0x00, 0x02, 0x82, 0x06, 0x00, 0x80, 0x10, 0x03, 0xb9, 0x04, 0x10, 0x01, 0x80, i, 0x00
                        ]);
                    }

                    recordDiagnosticEvent('sync_preset_requested', {
                        index: i,
                        bank: Math.floor(i / 3),
                        slot: SLOTS[i % 3]
                    });
                    await transportSend(buildFrame(presetReq));

                    const response = await readSolicitedFrame(3000, i);
                    let decodedName = null;
                    if (response) {
                        const afterMarker = extractAfterMarker(response, NAME_MARKER);
                        if (afterMarker && afterMarker.length >= 4) {
                            const nameData = afterMarker.slice(0, 32);
                            const name = decodePresetName(nameData);
                            if (name.length > 0) {
                                decodedName = name;
                                const bank = Math.floor(i / 3);
                                const slot = SLOTS[i % 3];
                                const key = getPresetKey(bank, slot);
                                if (!state.presets[key]) state.presets[key] = {};
                                state.presets[key].name = name;

                                const afterParam = extractAfterMarker(response, PARAM_MARKER);
                                if (afterParam && afterParam.length >= CAB_TYPE_INDEX * FLOAT_SIZE + 5) {
                                    const ampOff = AMP_ENABLE_INDEX * FLOAT_SIZE;
                                    if (afterParam[ampOff] === 0x88) {
                                        state.presets[key].amp = readFloat32(afterParam, ampOff + 1) > 0.5;
                                    }
                                    const cabOff = CAB_TYPE_INDEX * FLOAT_SIZE;
                                    if (afterParam[cabOff] === 0x88) {
                                        state.presets[key].cab = isCabEnabled(readFloat32(afterParam, cabOff + 1));
                                    }
                                }

                                if (i < 3) {
                                    console.log('[SYNC] Preset', i, name, 'AMP:', state.presets[key].amp, 'CAB:', state.presets[key].cab);
                                }

                                successCount++;
                            }
                        }
                    } else {
                        console.log('[SYNC] No response for preset', i);
                    }

                    recordDiagnosticEvent('sync_preset_result', {
                        index: i,
                        bank: Math.floor(i / 3),
                        slot: SLOTS[i % 3],
                        received: !!response,
                        decoded: decodedName !== null,
                        name: decodedName
                    });

                    loaded++;
                    await delay(50);
                }

                saveState();
                renderLibrary();
                renderGrid();
                textEl.textContent = t('syncDone') + successCount + '/' + total + t('syncPresetsRead');
                fillEl.style.width = '100%';
                libraryFreshness = successCount === total ? 'current' : (successCount > 0 ? 'cached' : 'stale');
                recordDiagnosticEvent('sync_complete', { loaded: loaded, successful: successCount, total: total });
            } catch(e) {
                recordDiagnosticEvent('sync_error', { message: e.message });
                console.error('Sync error:', e);
                textEl.textContent = t('syncError') + e.message;
                libraryFreshness = Object.keys(state.presets).length > 0 ? 'stale' : 'empty';
            } finally {
                await transportDisconnect();
                syncBtn.textContent = t('syncButton');
                updateOperatorHealth();
                setTimeout(() => progressEl.classList.remove('active'), 3000);
            }
        }

        document.getElementById('syncUSB').addEventListener('click', syncUSB);

        const diagnosticsButton = document.getElementById('exportDiagnostics');
        if (diagnosticsEnabled) {
            diagnosticsButton.hidden = false;
            diagnosticsButton.addEventListener('click', exportDiagnosticCapture);
            recordDiagnosticEvent('diagnostics_started');
        }

        // --- Export / Import JSON ---
        document.getElementById('exportJSON').addEventListener('click', () => {
            const exportData = {};
            for (let bank = 0; bank < TOTAL_BANKS; bank++) {
                for (const slot of SLOTS) {
                    const key = getPresetKey(bank, slot);
                    const info = state.presets[key];
                    if (info && info.name) {
                        exportData[key] = info.name;
                    }
                }
            }
            const json = JSON.stringify(exportData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tonex-presets.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('importJSON').addEventListener('click', () => {
            document.getElementById('importFileInput').click();
        });

        document.getElementById('importFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (typeof data !== 'object' || data === null || Array.isArray(data)) {
                        alert(t('importInvalid'));
                        return;
                    }
                    let count = 0;
                    for (const [key, name] of Object.entries(data)) {
                        const match = key.match(/^(\d+)_([ABC])$/);
                        if (!match) continue;
                        if (typeof name !== 'string' || name.length === 0) continue;
                        const bank = parseInt(match[1]);
                        const slot = match[2];
                        if (bank < 0 || bank >= TOTAL_BANKS) continue;
                        const presetKey = getPresetKey(bank, slot);
                        if (!state.presets[presetKey]) state.presets[presetKey] = {};
                        state.presets[presetKey].name = name;
                        count++;
                    }
                    saveState();
                    libraryFreshness = count > 0 ? 'cached' : libraryFreshness;
                    renderLibrary();
                    renderGrid();
                    updateOperatorHealth();
                    alert(t('importDone') + ' ' + count + t('importCount'));
                } catch(err) {
                    alert(t('importInvalid'));
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // --- Library Toggle ---
        const toggleBtn = document.getElementById('library-toggle');
        const mainLayout = document.getElementById('main-layout');
        if (localStorage.getItem('tonex-library-collapsed') === 'true') mainLayout.classList.add('collapsed');
        toggleBtn.addEventListener('click', () => {
            if (stageModeActive) return;
            mainLayout.classList.toggle('collapsed');
            localStorage.setItem('tonex-library-collapsed', mainLayout.classList.contains('collapsed'));
        });

        // --- Stage Operation ---
        const stageButton = document.getElementById('stageMode');
        const fullscreenButton = document.getElementById('fullscreenToggle');

        stageButton.addEventListener('click', () => setStageMode(!stageModeActive));

        if (!document.documentElement.requestFullscreen) {
            fullscreenButton.hidden = true;
        } else {
            fullscreenButton.addEventListener('click', async () => {
                try {
                    if (document.fullscreenElement) {
                        await document.exitFullscreen();
                    } else {
                        if (!stageModeActive) setStageMode(true);
                        await document.documentElement.requestFullscreen();
                    }
                } catch (error) {
                    recordDiagnosticEvent('fullscreen_failed', { message: error.message });
                }
                updateStageUi();
            });
            document.addEventListener('fullscreenchange', updateStageUi);
        }

        document.addEventListener('keydown', (event) => {
            if (event.repeat || event.metaKey || event.ctrlKey || event.altKey) return;
            const target = event.target;
            if (target && (target.matches('input, select, textarea') || target.isContentEditable)) return;
            if (document.getElementById('edit-overlay').style.display !== 'none') return;

            const padIndex = stageShortcutIndex(event.key);
            if (padIndex < 0) return;
            const assigned = state.buttons[padIndex];
            if (!assigned) return;
            event.preventDefault();
            bankSelectAndPC(assigned.bank, assigned.slot);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && stageModeActive && !stageWakeLock) requestStageWakeLock();
        });

        if (stageModePreference) setStageMode(true, false);
        else updateStageUi();

        // --- Init ---
        document.getElementById('search-box').addEventListener('input', renderLibrary);

        initTrash();
        applyLang();
        renderGrid();
        renderLibrary();
        initMIDI();
        initWebSocketBridge();

    })();
    </script>
</body>
</html>
