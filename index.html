<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
	<title>TONEX Pedal Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: #16213e;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 2px solid #0f3460;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 1.2em;
            color: #e94560;
            margin-right: 16px;
        }

        .midi-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .midi-controls label {
            font-size: 0.85em;
            color: #999;
        }

        .midi-controls select {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #533483;
            border-radius: 4px;
            padding: 5px 8px;
            font-size: 0.85em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .midi-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
        }

        .midi-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e94560;
        }

        .midi-status .dot.connected {
            background: #4caf50;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #0f3460;
            border: 1px solid #533483;
            color: #e94560;
            font-size: 1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
            flex-shrink: 0;
            cursor: pointer;
        }

        .icon-btn:hover {
            background: #533483;
            border-color: #e94560;
        }

        .lang-btn {
            font-size: 0.75em;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .main-layout {
            display: flex;
            height: calc(100vh - 52px);
            position: relative;
        }

        .library-panel {
            width: 400px;
            min-width: 320px;
            border-right: 2px solid #0f3460;
            display: flex;
            flex-direction: column;
            background: #16213e;
        }

        .library-header {
            padding: 12px;
            border-bottom: 1px solid #0f3460;
        }

        .trash-zone {
            background: #2a1a1a;
            border: 2px dashed #e94560;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #e94560;
            transition: all 0.2s;
        }

        .trash-zone.drag-over {
            background: #e94560;
            color: #fff;
            border-color: #fff;
            transform: scale(1.02);
        }

        .trash-zone .trash-icon {
            font-size: 1.4em;
            display: block;
            margin-bottom: 2px;
        }

        .search-box {
            width: 100%;
            background: #0f3460;
            border: 1px solid #533483;
            border-radius: 4px;
            padding: 8px 10px;
            color: #e0e0e0;
            font-size: 0.9em;
        }

        .search-box::placeholder {
            color: #666;
        }

        .preset-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .preset-list::-webkit-scrollbar {
            width: 8px;
        }

        .preset-list::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        .preset-list::-webkit-scrollbar-thumb {
            background: #533483;
            border-radius: 4px;
        }

        .bank-group {
            margin-bottom: 8px;
        }

        .bank-label {
            font-size: 0.75em;
            color: #533483;
            font-weight: bold;
            padding: 4px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .preset-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: grab;
            transition: background 0.15s;
            border: 1px solid transparent;
            user-select: none;
        }

        .preset-row:hover {
            background: #1a1a3e;
            border-color: #533483;
        }

        .preset-row.active {
            background: #0f3460;
            border-color: #e94560;
        }

        .preset-row:active {
            cursor: grabbing;
        }

        .preset-row.dragging {
            opacity: 0.4;
        }

        .preset-slot {
            font-weight: bold;
            font-size: 0.9em;
            color: #e94560;
            width: 20px;
            text-align: center;
        }

        .preset-name {
            flex: 1;
            font-size: 0.85em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preset-badges {
            display: flex;
            gap: 4px;
        }

        .badge {
            font-size: 0.65em;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        .badge.amp-on {
            background: #4caf50;
            color: #000;
        }

        .badge.amp-off {
            background: #333;
            color: #666;
        }

        .badge.cab-on {
            background: #2196f3;
            color: #000;
        }

        .badge.cab-off {
            background: #333;
            color: #666;
        }

        .grid-panel {
            flex: 1;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            padding: 16px;
        }

        .library-toggle {
            position: absolute;
            left: 396px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 48px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-left: none;
            border-radius: 0 8px 8px 0;
            color: #533483;
            font-size: 14px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.3s, color 0.2s;
        }

        .library-toggle:hover {
            color: #e94560;
        }

        .main-layout.collapsed .library-panel {
            width: 0;
            min-width: 0;
            overflow: hidden;
            border: none;
        }

        .main-layout.collapsed .library-toggle {
            left: 0;
        }

        .main-layout.collapsed .library-toggle::after {
            content: '◀';
        }

        .library-toggle::after {
            content: '▶';
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            height: 100%;
        }

        .grid-btn {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            position: relative;
            padding: 12px;
            min-height: 0;
            container-type: inline-size;
            overflow: hidden;
        }

        .grid-btn:hover {
            border-color: #533483;
        }

        .grid-btn.active {
            border-color: #e94560;
            box-shadow: 0 0 16px rgba(233, 69, 96, 0.3);
        }

        .grid-btn.drag-over {
            border-color: #4caf50;
            background: #1a2e1a;
        }

        .grid-btn.empty {
            border-style: dashed;
            opacity: 0.5;
        }

        .grid-btn.empty:hover {
            opacity: 0.8;
        }

        .grid-btn .btn-slot {
            font-size: 4cqi;
            color: #533483;
            font-weight: bold;
        }

        .grid-btn .btn-preset {
            font-size: 5.5cqi;
            font-weight: bold;
            color: #e94560;
        }

        .grid-btn .btn-name {
            font-size: 5cqi;
            color: #ccc;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .grid-btn .btn-badges {
            display: flex;
            gap: 4px;
        }

        .grid-btn .btn-badges .badge {
            font-size: 3.5cqi;
            padding: 1cqi 2cqi;
        }

        .grid-btn .empty-label {
            font-size: 5cqi;
            color: #555;
        }

        footer {
            background: #16213e;
            border-top: 1px solid #0f3460;
            padding: 8px 24px;
            font-size: 0.75em;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .edit-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .edit-modal {
            background: #16213e;
            border: 2px solid #533483;
            border-radius: 12px;
            padding: 24px;
            width: 360px;
        }

        .edit-modal h3 {
            margin-bottom: 16px;
            color: #e94560;
        }

        .edit-modal label {
            display: block;
            font-size: 0.85em;
            color: #999;
            margin-bottom: 4px;
            margin-top: 12px;
        }

        .edit-modal input[type="text"] {
            width: 100%;
            background: #0f3460;
            border: 1px solid #533483;
            border-radius: 4px;
            padding: 8px;
            color: #e0e0e0;
            font-size: 0.9em;
        }

        .edit-modal .checkbox-row {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }

        .edit-modal .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #e0e0e0;
            font-size: 0.9em;
            margin: 0;
        }

        .edit-modal .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        .edit-modal button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .btn-cancel {
            background: #333;
            color: #ccc;
        }

        .btn-save {
            background: #e94560;
            color: #fff;
        }

        .btn-delete {
            background: #661111;
            color: #e94560;
        }

        .sync-btn {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #533483;
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 0.85em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sync-btn:hover {
            background: #533483;
        }

        .sync-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sync-progress {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 0.8em;
            color: #999;
        }

        .sync-progress.active {
            display: flex;
        }

        .sync-progress-bar {
            flex: 1;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            overflow: hidden;
            min-width: 100px;
        }

        .sync-progress-fill {
            height: 100%;
            background: #e94560;
            border-radius: 3px;
            transition: width 0.2s;
            width: 0%;
        }

        .sync-progress-text {
            white-space: nowrap;
        }

        .operator-status {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            padding: 5px 12px;
            background: #11182d;
            border-bottom: 1px solid #0f3460;
            font-size: 0.78em;
            flex-wrap: wrap;
        }

        .health-chip {
            padding: 3px 8px;
            border: 1px solid #555;
            border-radius: 999px;
            color: #aaa;
            white-space: nowrap;
        }

        .health-chip[data-state="ok"] {
            border-color: #4caf50;
            color: #8be28f;
        }

        .health-chip[data-state="busy"] {
            border-color: #ffb300;
            color: #ffd166;
        }

        .health-chip[data-state="error"] {
            border-color: #e94560;
            color: #ff8295;
        }

        .preset-command-status {
            flex: 1;
            min-width: 180px;
            color: #aaa;
        }

        .preset-command-status[data-state="pending"] { color: #ffd166; }
        .preset-command-status[data-state="confirmed"] { color: #8be28f; }
        .preset-command-status[data-state="error"] { color: #ff8295; }

        .preset-row.pending,
        .grid-btn.pending {
            border-color: #ffb300;
            box-shadow: 0 0 14px rgba(255, 179, 0, 0.35);
            animation: pending-pulse 0.8s ease-in-out infinite alternate;
        }

        .preset-row.requested,
        .grid-btn.requested {
            border-color: #8d78b8;
            border-style: dashed;
        }

        .preset-row.active.stale,
        .grid-btn.active.stale {
            border-style: dashed;
            box-shadow: none;
        }

        @keyframes pending-pulse {
            from { opacity: 0.72; }
            to { opacity: 1; }
        }

        @media (max-width: 700px) {
            .library-panel {
                width: 260px;
                min-width: 0;
            }
            .library-toggle {
                left: 258px;
                right: auto;
            }
            .main-layout.collapsed .library-toggle {
                left: 0;
            }
            .grid-btn .btn-slot {
                font-size: 10px;
            }
            .grid-btn .btn-preset {
                font-size: 13px;
            }
            .grid-btn .btn-name {
                font-size: 12px;
                white-space: normal;
                line-height: 1.2;
            }
            .grid-btn .btn-badges .badge {
                font-size: 9px;
                padding: 2px 4px;
            }
            .grid-btn .empty-label {
                font-size: 12px;
            }
            header {
                padding: 6px 12px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .header-row {
                flex-wrap: wrap;
                gap: 6px;
            }
            footer {
                padding: 6px 12px;
                font-size: 0.75em;
            }
            .grid-btn {
                padding: 6px;
                gap: 3px;
            }
        }
    </style>
    <link rel="stylesheet" href="ui.css">
</head>
<body>
    <header>
        <div class="brand-block">
            <span class="brand-mark" aria-hidden="true">TX</span>
            <div class="brand-copy">
                <span class="brand-kicker">PEDAL CONTROL SYSTEM</span>
                <h1>TONEX <strong>REMOTE</strong></h1>
            </div>
        </div>
        <div class="midi-controls">
            <div class="control-field device-field">
                <label for="midi-device" data-i18n="device">Device :</label>
                <select id="midi-device"><option value="" data-i18n="choose">-- Choisir --</option></select>
            </div>
            <div class="control-field channel-field">
                <label for="midi-channel" data-i18n="channel">Canal :</label>
                <select id="midi-channel"></select>
            </div>
        </div>
        <div class="header-right">
            <div class="midi-status">
                <div class="dot" id="midi-dot"></div>
                <span id="midi-status-text" data-i18n="disconnected">Non connecté</span>
            </div>
            <div class="header-actions">
                <button id="syncUSB" class="sync-btn primary-action" data-i18n="syncButton" title="Sync preset names via USB">SYNC USB</button>
                <button id="exportJSON" class="sync-btn" data-i18n="exportButton" title="Export preset names to JSON">EXPORT</button>
                <button id="importJSON" class="sync-btn" data-i18n="importButton" title="Import preset names from JSON">IMPORT</button>
                <button id="exportDiagnostics" class="sync-btn" data-i18n="diagnosticsButton" title="Export diagnostic capture" hidden>DIAGNOSTICS</button>
                <button id="stageMode" class="sync-btn stage-mode-btn" aria-pressed="false" data-i18n="stageMode">STAGE LOCK</button>
                <button id="fullscreenToggle" class="icon-btn fullscreen-btn" aria-pressed="false" title="Enter fullscreen">⛶</button>
                <button id="langToggle" class="icon-btn lang-btn" title="Switch language">EN</button>
                <a href="docs/" target="_blank" class="icon-btn" title="Documentation">?</a>
            </div>
            <input type="file" id="importFileInput" accept=".json" style="display:none">
            <div id="syncProgress" class="sync-progress">
                <div class="sync-progress-bar"><div id="syncProgressFill" class="sync-progress-fill"></div></div>
                <span id="syncProgressText" class="sync-progress-text"></span>
            </div>
        </div>
    </header>

    <div class="operator-status" id="operator-status" role="status" aria-live="polite">
        <span class="status-legend" data-i18n="systemStatus">System</span>
        <span class="health-chip" id="bridge-health"></span>
        <span class="health-chip" id="pedal-health"></span>
        <span class="health-chip" id="library-health"></span>
        <span class="health-chip stage-health" id="stage-health"></span>
        <span class="preset-command-status" id="preset-command-status"></span>
    </div>

    <div class="main-layout" id="main-layout">
        <div class="library-panel">
            <div class="panel-heading library-heading">
                <div>
                    <span class="section-kicker" data-i18n="libraryKicker">Tone library</span>
                    <h2 data-i18n="libraryTitle">Pedal presets</h2>
                </div>
                <span class="panel-meta">50 × 3</span>
            </div>
            <div class="library-header">
                <input type="text" class="search-box" id="search-box" data-i18n-placeholder="searchPlaceholder" placeholder="Rechercher un preset...">
                <div class="trash-zone" id="trash-zone">
                    <span class="trash-icon">🗑️</span>
                    <span data-i18n="trashText">Glisser ici pour effacer le bouton</span>
                </div>
            </div>
            <div class="preset-list" id="preset-list"></div>
        </div>

        <button class="library-toggle" id="library-toggle" title="Masquer/Afficher la bibliothèque"></button>

        <div class="grid-panel">
            <div class="grid-shell">
                <div class="panel-heading performance-heading">
                    <div>
                        <span class="section-kicker" data-i18n="performanceKicker">Performance</span>
                        <h2 data-i18n="performanceTitle">Quick access deck</h2>
                    </div>
                    <span class="panel-meta" data-i18n="performanceMeta">9 assignable pads</span>
                </div>
                <div class="preset-grid" id="preset-grid"></div>
            </div>
        </div>
    </div>

    <footer>
        <span data-i18n="footerHelp">AMP / CAB &nbsp; • &nbsp; Clic preset = écouter &nbsp; • &nbsp; Drag = assigner / swap</span>
        <span id="active-preset" data-i18n="activePreset">Preset actif: --</span>
    </footer>

    <div class="edit-overlay" id="edit-overlay" style="display:none">
        <div class="edit-modal">
            <h3 id="edit-title" data-i18n="editTitle">Éditer le preset</h3>
            <label data-i18n="presetName">Nom du preset</label>
            <input type="text" id="edit-name" maxlength="20" data-i18n-placeholder="presetName" placeholder="Nom du preset">
            <div class="checkbox-row">
                <label><input type="checkbox" id="edit-amp"> AMP</label>
                <label><input type="checkbox" id="edit-cab"> CAB</label>
            </div>
            <div class="btn-row">
                <button class="btn-cancel" id="edit-cancel" data-i18n="cancel">Annuler</button>
                <button class="btn-delete" id="edit-delete" style="display:none" data-i18n="delete">Effacer</button>
                <button class="btn-save" id="edit-save" data-i18n="save">Valider</button>
            </div>
        </div>
    </div>

        function recordDiagnosticEvent(type, details = {}) {
            if (!diagnosticCapture) return;
            diagnosticCapture.events.push({
                elapsed_ms: Math.round((performance.now() - diagnosticStartedAt) * 1000) / 1000,
                type: type,
                ...details
            });
        }

        function exportDiagnosticCapture() {
            if (!diagnosticCapture) return;
            recordDiagnosticEvent('diagnostic_exported', { event_count: diagnosticCapture.events.length });

            const json = JSON.stringify(diagnosticCapture, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            a.href = url;
            a.download = 'tonex-diagnostic-' + timestamp + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

                manufacturer_name: device.manufacturerName || '',
                configuration_value: configuration ? configuration.configurationValue : null,
                interfaces: configuration ? configuration.interfaces.map(iface => ({
                    interface_number: iface.interfaceNumber,
                    alternates: iface.alternates.map(alt => ({
                        alternate_setting: alt.alternateSetting,
                        interface_class: alt.interfaceClass,
                        interface_subclass: alt.interfaceSubclass,
                        interface_protocol: alt.interfaceProtocol,
                        endpoints: alt.endpoints.map(endpoint => ({
                            endpoint_number: endpoint.endpointNumber,

        function updateStageUi() {

            if (!stageButton || !stageHealth || !fullscreenButton) return;

            stageButton.textContent = stageModeActive ? t('stageExit') : t('stageMode');
            stageButton.setAttribute('aria-pressed', String(stageModeActive));
            stageButton.classList.toggle('active', stageModeActive);

            stageHealth.dataset.state = stageModeActive ? 'ok' : '';
            stageHealth.textContent = !stageModeActive ? t('stageEdit') :
                (stageWakeState === 'active' ? t('stageAwake') :
                    (stageWakeState === 'unavailable' || stageWakeState === 'error' ?
                        t('stageWakeUnavailable') : t('stageLocked')));

            const isFullscreen = !!document.fullscreenElement;
            fullscreenButton.setAttribute('aria-pressed', String(isFullscreen));
            fullscreenButton.classList.toggle('active', isFullscreen);
            fullscreenButton.title = t(isFullscreen ? 'fullscreenExit' : 'fullscreenEnter');

        async function requestStageWakeLock() {
            if (!stageModeActive || document.hidden || stageWakeLock) return;
            if (!('wakeLock' in navigator)) {
                stageWakeState = 'unavailable';
                updateStageUi();
                return;
            }

            stageWakeState = 'requesting';
            updateStageUi();
            try {
                const lock = await navigator.wakeLock.request('screen');
                if (!stageModeActive) {
                    await lock.release();
                    return;
                }
                stageWakeLock = lock;
                stageWakeState = 'active';
                lock.addEventListener('release', () => {
                    if (stageWakeLock === lock) stageWakeLock = null;
                    stageWakeState = 'idle';
                    updateStageUi();
                });
            } catch (error) {
                stageWakeState = 'error';
                recordDiagnosticEvent('stage_wake_lock_failed', { message: error.message });
            }
            updateStageUi();
        }

        async function releaseStageWakeLock() {
            const lock = stageWakeLock;
            stageWakeLock = null;
            stageWakeState = 'idle';
            if (lock) {
                try { await lock.release(); } catch (error) {}
            }
            updateStageUi();
        }

        function setStageMode(enabled, persist = true) {
            const next = !!enabled;
            if (next && !stageModeActive) {
                libraryWasCollapsedBeforeStage = mainLayout.classList.contains('collapsed');
                closeEditModal();
            }
            stageModeActive = next;
            document.body.classList.toggle('stage-mode', stageModeActive);
            if (stageModeActive) {
                mainLayout.classList.add('collapsed');
                requestStageWakeLock();
            } else {
                if (!libraryWasCollapsedBeforeStage) mainLayout.classList.remove('collapsed');
                releaseStageWakeLock();
                if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
            }
            if (persist) {
                state.ui.stageMode = stageModeActive;
                saveState();
            }
            renderGrid();
            renderLibrary();
            updateStageUi();
        }

        function getPresetKey(bank, slot) {
            return bank + '_' + slot;
        }

        function getPresetInfo(bank, slot) {
            const key = getPresetKey(bank, slot);
            if (!state.presets[key]) {
                state.presets[key] = {
                    name: 'Preset ' + String(bank).padStart(2,'0') + slot,
                    amp: false,
                    cab: false
                };
            }
            return state.presets[key];
        }

        function bankSlotFromPC(pc) {
            return { bank: Math.floor(pc / 3), slot: SLOTS[pc % 3] };
        }

        function pcFromBankSlot(bank, slot) {
            const slotIndex = SLOTS.indexOf(slot);
            return bank * 3 + slotIndex;
        }

        function transitionPresetCommand(current, event) {
            const next = {
                ...current,
                pending: current.pending ? { ...current.pending } : null
            };

            if (event.type === 'request') {
                next.pending = {
                    requestId: event.requestId,
                    pc: event.pc,
                    bank: event.bank,
                    slot: event.slot,
                    phase: 'queued'
                };
                next.lastRequestedPc = event.pc;
                next.commandStatus = 'queued';
            } else if (event.type === 'accepted') {
                if (next.pending && next.pending.requestId === event.requestId) {
                    next.pending.phase = 'waiting';
                    next.commandStatus = 'waiting';
                }
            } else if (event.type === 'confirmed') {
                next.activePc = event.pc;
                next.activeFreshness = 'confirmed';
                if (next.pending && next.pending.pc === event.pc) {
                    next.pending = null;
                    next.lastRequestedPc = event.pc;
                    next.commandStatus = 'confirmed';
                } else if (!next.pending) {
                    next.lastRequestedPc = event.pc;
                    next.commandStatus = 'confirmed';
                }
            } else if (event.type === 'timeout') {
                if (next.pending && next.pending.requestId === event.requestId) {
                    next.pending = null;
                    next.commandStatus = 'timed_out';
                }
            } else if (event.type === 'failed') {
                if (next.pending && next.pending.requestId === event.requestId) {
                    next.pending = null;
                    next.commandStatus = 'failed';
                }
            } else if (event.type === 'local_sent') {
                if (next.pending && next.pending.requestId === event.requestId) {
                    next.pending = null;
                    next.commandStatus = 'unconfirmed';
                }
            } else if (event.type === 'disconnected') {
                if (next.activePc >= 0) next.activeFreshness = 'stale';
                if (next.pending) {
                    next.pending = null;
                    next.commandStatus = 'disconnected';
                }
            } else if (event.type === 'connected_without_preset') {
                if (next.activePc >= 0) next.activeFreshness = 'stale';
            }

            return next;
        }

        function presetLabel(pc) {
            if (pc < 0) return '--';
            const location = bankSlotFromPC(pc);
            return String(location.bank).padStart(2, '0') + location.slot;
        }

        function formatPresetMessage(key, pc) {
            return t(key).replace('{preset}', presetLabel(pc));
        }

        function clearPresetTimers() {
            if (presetDispatchTimer) clearTimeout(presetDispatchTimer);
            if (presetConfirmTimer) clearTimeout(presetConfirmTimer);
            presetDispatchTimer = null;
            presetConfirmTimer = null;
        }

        function applyPresetCommandEvent(event) {
            presetCommandState = transitionPresetCommand(presetCommandState, event);
            activePresetPC = presetCommandState.activePc;
            if (activePresetPC >= 0) {
                const location = bankSlotFromPC(activePresetPC);
                activePresetBank = location.bank;
                activePresetSlot = location.slot;
            } else {
                activePresetBank = -1;
                activePresetSlot = '';
            }
            updateActivePresetDisplay();
            updatePresetCommandStatus();
            renderLibrary();
            renderGrid();
        }

        // --- Hardware control transports ---
        const localHardwareTransport = {
            id: 'local',

            isConnected() {
                return !!midiOutput;
            },

            sendPreset(bank, slot, channel, requestId) {
                if (!midiOutput) return false;

                const pc = pcFromBankSlot(bank, slot);
                const midiCh = 0xB0 + channel;
                const bankSelect = [midiCh, 0, pc > 127 ? 1 : 0];
                const programChange = [0xC0 + channel, pc > 127 ? pc - 128 : pc];
                recordDiagnosticEvent('midi_send', {
                    transport: 'webmidi',
                    bank: bank,
                    slot: slot,
                    pc: pc,
                    channel: channel,
                    request_id: requestId,
                    bank_select: bankSelect,
                    program_change: programChange
                });
                try {
                    midiOutput.send(bankSelect);
                    midiOutput.send(programChange, performance.now() + 30);
                    return true;
                } catch (error) {
                    recordDiagnosticEvent('midi_send_failed', {
                        request_id: requestId,
                        message: error.message
                    });
                    return false;
                }
            },

            syncPresets() {
                return syncLocalUSB();
            }
        };

        const bridgeTransport = {
            id: 'bridge',

            isConnected() {
                return isBridgeConnected && wsBridge && wsBridge.readyState === WebSocket.OPEN;
            },

            sendPreset(bank, slot, channel, requestId) {
                if (!this.isConnected()) return false;
                const message = {
                    action: 'midi_send',
                    bank: bank,
                    slot: slot,
                    pc: pcFromBankSlot(bank, slot),
                    channel: channel,
                    request_id: requestId
                };
                recordDiagnosticEvent('bridge_tx', { message: message });
                try {
                    wsBridge.send(JSON.stringify(message));
                    return true;
                } catch (error) {
                    recordDiagnosticEvent('bridge_send_failed', {
                        request_id: requestId,
                        message: error.message
                    });
                    return false;
                }
            },

            syncPresets() {
                if (!this.isConnected()) return false;
                const requestId = ++bridgeSyncRequestSequence;
                const message = { action: 'sync_start', request_id: requestId };
                bridgePendingSyncRequestId = requestId;
                recordDiagnosticEvent('bridge_tx', { message: message });
                wsBridge.send(JSON.stringify(message));
                return true;
            },

            cancelSync() {
                if (!this.isConnected()) return false;
                const requestId = ++bridgeSyncRequestSequence;
                const message = { action: 'sync_cancel', request_id: requestId };
                bridgePendingSyncRequestId = requestId;
                recordDiagnosticEvent('bridge_tx', { message: message });
                wsBridge.send(JSON.stringify(message));
                return true;
            }
        };

        function getActiveControlTransport() {
            if (isBridgeHost) return bridgeTransport;
            return bridgeTransport.isConnected() ? bridgeTransport : localHardwareTransport;
        }

        function showBridgeDeviceOption() {

        function removeBridgeDeviceOption() {
            const select = document.getElementById('midi-device');
            if (!select) return;

            const option = select.querySelector('option[value="bridge"]');

            if (midiOutput) {

        function syncUiElements() {
            return {
                button: document.getElementById('syncUSB'),
                progress: document.getElementById('syncProgress'),
                fill: document.getElementById('syncProgressFill'),
                text: document.getElementById('syncProgressText')
            };
        }

        function beginBridgeSync(ownerClientId = null) {
            const ui = syncUiElements();
            if (syncProgressHideTimer) clearTimeout(syncProgressHideTimer);
            bridgeSyncActive = true;
            bridgeSyncOwnerClientId = ownerClientId;
            libraryFreshness = 'syncing';
            const canCancel = ownerClientId === null || ownerClientId === bridgeClientId;
            ui.button.textContent = canCancel ? t('cancelSync') : t('syncObserved');
            ui.button.disabled = !canCancel;
            ui.progress.classList.add('active');
            ui.fill.style.width = '0%';
            ui.text.textContent = t('syncInProgress');
            updateOperatorHealth();
        }

        function finishBridgeSync(message, percent, autoHide = true) {
            const ui = syncUiElements();
            bridgeSyncActive = false;
            bridgeSyncOwnerClientId = null;
            bridgePendingSyncRequestId = null;
            ui.button.textContent = t('syncButton');
            ui.button.disabled = false;
            ui.progress.classList.add('active');
            ui.fill.style.width = Math.max(0, Math.min(100, percent || 0)) + '%';
            ui.text.textContent = message;

            if (syncProgressHideTimer) clearTimeout(syncProgressHideTimer);
            if (autoHide) {
                syncProgressHideTimer = setTimeout(() => ui.progress.classList.remove('active'), 3000);
            }
            updateOperatorHealth();
        }

        async function initWebSocketBridge() {
            if (!window.location.protocol.startsWith('http')) return;

            try {
                const response = await fetch(BRIDGE_DISCOVERY_PATH, {
                    cache: 'no-store',
                    headers: { Accept: 'application/json' }
                });
                if (!response.ok) return;

                const identity = await response.json();
                if (identity.service !== 'tonex-bridge' || identity.protocol_version !== BRIDGE_PROTOCOL_VERSION) {
                    recordDiagnosticEvent('bridge_discovery_rejected', { identity: identity });
                    return;
                }

                isBridgeHost = true;
                recordDiagnosticEvent('bridge_discovered', { identity: identity });
                connectWebSocketBridge();
            } catch(e) {
                recordDiagnosticEvent('bridge_discovery_failed', { message: e.message });
                console.log('[BRIDGE] This host is not a ToneX bridge');
            }
        }

        function scheduleBridgeReconnect() {
            if (!isBridgeHost || bridgeReconnectTimer) return;
            bridgeReconnectTimer = setTimeout(() => {
                bridgeReconnectTimer = null;
                connectWebSocketBridge();
            }, 4000);
        }

        function stopBridgeHeartbeat() {
            if (bridgeHeartbeatTimer) clearInterval(bridgeHeartbeatTimer);
            bridgeHeartbeatTimer = null;
        }

        function requestBridgeStatus() {
            if (!wsBridge || wsBridge.readyState !== WebSocket.OPEN) return false;
            try {
                wsBridge.send(JSON.stringify({ action: 'status_request' }));
                return true;
            } catch (error) {
                recordDiagnosticEvent('bridge_status_request_failed', { message: error.message });
                return false;
            }
        }

        function startBridgeHeartbeat() {
            stopBridgeHeartbeat();
            bridgeLastMessageAt = Date.now();
            bridgeHeartbeatTimer = setInterval(() => {
                if (document.hidden || !wsBridge || wsBridge.readyState !== WebSocket.OPEN) return;
                if (Date.now() - bridgeLastMessageAt > BRIDGE_STALE_AFTER_MS) {
                    recordDiagnosticEvent('bridge_stale', {
                        silent_ms: Date.now() - bridgeLastMessageAt
                    });
                    wsBridge.close();
                    return;
                }
                requestBridgeStatus();
            }, BRIDGE_HEARTBEAT_INTERVAL_MS);
        }

        function connectWebSocketBridge() {
            if (!isBridgeHost) return;
            if (wsBridge && (wsBridge.readyState === WebSocket.OPEN || wsBridge.readyState === WebSocket.CONNECTING)) return;

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = wsProtocol + '//' + window.location.host + '/ws';

            try {
                wsBridge = new WebSocket(wsUrl);
                updateOperatorHealth();
                wsBridge.onopen = () => {
                    if (bridgeReconnectTimer) clearTimeout(bridgeReconnectTimer);
                    bridgeReconnectTimer = null;
                    isBridgeConnected = true;
                    startBridgeHeartbeat();
                    updateMIDIStatus(isBridgeToneXConnected, true);
                    applyPresetCommandEvent({ type: 'connected_without_preset' });
                    showBridgeDeviceOption();
                    recordDiagnosticEvent('bridge_connected');
                    console.log('[BRIDGE] Connected to ToneX Wi-Fi Bridge');
                };

                wsBridge.onmessage = (event) => {
                    try {
                        bridgeLastMessageAt = Date.now();
                        const data = JSON.parse(event.data);
                        recordDiagnosticEvent('bridge_rx', { message: data });
                        if (data.event === 'status') {
                            if (data.client_id !== undefined) bridgeClientId = data.client_id;
                            isBridgeToneXConnected = !!data.tonex_connected;
                            updateMIDIStatus(isBridgeToneXConnected, true);
                            if (!isBridgeToneXConnected) {
                                clearPresetTimers();
                                applyPresetCommandEvent({ type: 'disconnected' });
                                if (libraryFreshness === 'current') libraryFreshness = 'stale';
                            } else if (data.active_pc !== undefined && data.active_pc >= 0) {
                                if (presetConfirmTimer && presetCommandState.pending && presetCommandState.pending.pc === data.active_pc) {
                                    clearTimeout(presetConfirmTimer);
                                    presetConfirmTimer = null;
                                }
                                applyPresetCommandEvent({ type: 'confirmed', pc: data.active_pc });
                            } else {
                                applyPresetCommandEvent({ type: 'connected_without_preset' });
                            }
                            updateOperatorHealth();
                        } else if (data.event === 'midi_accepted') {
                            applyPresetCommandEvent({ type: 'accepted', requestId: data.request_id });
                        } else if (data.event === 'sync_started') {
                            bridgePendingSyncRequestId = null;
                            beginBridgeSync(data.owner_client_id ?? bridgeClientId);
                        } else if (data.event === 'sync_progress') {
                            const ui = syncUiElements();
                            if (!bridgeSyncActive) beginBridgeSync(data.owner_client_id ?? null);
                            ui.fill.style.width = (data.percent || 0) + '%';
                            ui.text.textContent = (data.loaded || 0) + ' / ' + (data.total || TOTAL_PRESETS) + '...';
                        } else if (data.event === 'sync_complete') {
                            const total = data.total || TOTAL_PRESETS;
                            libraryFreshness = 'current';
                            finishBridgeSync(t('syncDone') + total + '/' + total + t('syncPresetsRead'), 100);
                        } else if (data.event === 'sync_cancelled') {
                            libraryFreshness = Object.keys(state.presets).length > 0 ? 'cached' : 'empty';
                            finishBridgeSync(t('syncCancelled'), 0);
                        } else if (data.event === 'error') {
                            const errorMessage = data.message || data.code || 'Unknown bridge error';
                            if (String(data.code || '').startsWith('sync_')) {
                                if (data.request_id === undefined || data.request_id === bridgePendingSyncRequestId || bridgeSyncActive) {
                                    libraryFreshness = Object.keys(state.presets).length > 0 ? 'stale' : 'empty';
                                    finishBridgeSync(t('syncError') + errorMessage, 0, false);
                                }
                            } else if (data.request_id !== undefined) {
                                if (presetCommandState.pending && presetCommandState.pending.requestId === data.request_id) {
                                    clearPresetTimers();
                                }
                                applyPresetCommandEvent({ type: 'failed', requestId: data.request_id });
                            }
                        } else if (data.event === 'preset_update') {
                            const key = getPresetKey(data.bank, data.slot);
                            if (!state.presets[key]) state.presets[key] = {};
                            state.presets[key].name = data.name;
                            state.presets[key].amp = !!data.amp;
                            state.presets[key].cab = !!data.cab;
                            saveState();
                            renderLibrary();
                            renderGrid();
                        }
                    } catch(e) {
                        console.error('WS parse error:', e);
                    }
                };

                wsBridge.onclose = () => {
                    recordDiagnosticEvent('bridge_disconnected');
                    stopBridgeHeartbeat();
                    wsBridge = null;
                    bridgeClientId = null;
                    bridgeSyncOwnerClientId = null;
                    bridgePendingSyncRequestId = null;
                    isBridgeConnected = false;
                    isBridgeToneXConnected = false;
                    clearPresetTimers();
                    applyPresetCommandEvent({ type: 'disconnected' });
                    if (libraryFreshness === 'current') libraryFreshness = 'stale';
                    removeBridgeDeviceOption();
                    updateMIDIStatus(!!midiOutput);
                    if (bridgeSyncActive) {
                        libraryFreshness = Object.keys(state.presets).length > 0 ? 'stale' : 'empty';
                        finishBridgeSync(t('syncError') + t('bridgeDisconnected'), 0, false);
                    }
                    updateOperatorHealth();
                    scheduleBridgeReconnect();
                };

                wsBridge.onerror = () => {
                    recordDiagnosticEvent('bridge_error');
                    isBridgeConnected = false;
                    updateOperatorHealth();
                };
            } catch(e) {
                recordDiagnosticEvent('bridge_connection_failed', { message: e.message });
                console.log('[BRIDGE] WebSocket connection failed');
                scheduleBridgeReconnect();
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden || !isBridgeHost) return;
            if (wsBridge && wsBridge.readyState === WebSocket.OPEN) {
                bridgeLastMessageAt = Date.now();
                requestBridgeStatus();
            } else {
                connectWebSocketBridge();
            }
        });

        // --- MIDI ---
        function updateActivePresetDisplay() {
            const el = document.getElementById('active-preset');
            el.dataset.base = 'activePreset';
            if (activePresetPC >= 0) {
                const info = getPresetInfo(activePresetBank, activePresetSlot);
                const freshnessKey = presetCommandState.activeFreshness === 'confirmed' ? 'activeConfirmed' : 'activeStale';
                el.textContent = t('activePreset') + String(activePresetBank).padStart(2,'0') + activePresetSlot + ' \u2014 ' + info.name + ' (' + t(freshnessKey) + ')';
            } else {
                el.textContent = t('activePreset') + '--';
            }
        }

        function bankSelectAndPC(bank, slot) {
            const pc = pcFromBankSlot(bank, slot);
            const requestId = ++presetRequestSequence;
            const transport = getActiveControlTransport();

            clearPresetTimers();
            applyPresetCommandEvent({ type: 'request', requestId, pc, bank, slot });
            recordDiagnosticEvent('preset_requested', {
                request_id: requestId,
                transport: transport.id,
                bank,
                slot,
                pc
            });

            presetDispatchTimer = setTimeout(() => {
                presetDispatchTimer = null;
                if (!presetCommandState.pending || presetCommandState.pending.requestId !== requestId) return;

                const sent = transport.sendPreset(bank, slot, midiChannel, requestId);
                if (!sent) {
                    applyPresetCommandEvent({ type: 'failed', requestId });
                    return;
                }

                if (transport === localHardwareTransport) {
                    applyPresetCommandEvent({ type: 'local_sent', requestId });
                    return;
                }

                presetConfirmTimer = setTimeout(() => {
                    presetConfirmTimer = null;
                    applyPresetCommandEvent({ type: 'timeout', requestId });
                }, PRESET_CONFIRM_TIMEOUT_MS);
            }, PRESET_SEND_DEBOUNCE_MS);
        }

        function refreshMIDIOutputs() {
            if (!midiAccessHandle) return;
            const select = document.getElementById('midi-device');
            const previousOutput = midiOutput;
            const outputs = Array.from(midiAccessHandle.outputs.values())
                .filter(output => output.state !== 'disconnected');

            select.innerHTML = '';
            outputs.forEach(output => {
                const opt = document.createElement('option');
                opt.value = 'midi:' + output.id;
                opt.textContent = output.name;
                select.appendChild(opt);
            });

            midiOutput = previousOutput ?
                (outputs.find(output => output.id === previousOutput.id) || null) :
                (outputs.find(output => state.midi.device && output.name === state.midi.device) ||
                    outputs[0] || null);

            if (midiOutput) {
                select.value = 'midi:' + midiOutput.id;
            } else {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = t('noDevice');
                select.insertBefore(opt, select.firstChild);
                select.value = '';
                if (previousOutput && !isBridgeHost) {
                    clearPresetTimers();
                    applyPresetCommandEvent({ type: 'disconnected' });
                }
            }

            if (isBridgeConnected) {
                showBridgeDeviceOption();
                updateMIDIStatus(isBridgeToneXConnected, true);
            } else {
                updateMIDIStatus(!!midiOutput);
            }
        }

        async function initMIDI() {
            const chSelect = document.getElementById('midi-channel');
            chSelect.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = 'Ch ' + (i + 1);
                chSelect.appendChild(opt);
            }
            chSelect.value = state.midi.channel || 0;
            midiChannel = state.midi.channel || 0;
            chSelect.addEventListener('change', () => {
                midiChannel = parseInt(chSelect.value);
                state.midi.channel = midiChannel;
                saveState();
            });

            try {
                midiAccessHandle = await navigator.requestMIDIAccess();
                const select = document.getElementById('midi-device');
                select.addEventListener('change', () => {
                    if (select.value === 'bridge') {
                        updateMIDIStatus(isBridgeToneXConnected, true);
                        return;
                    }

                    const outputId = select.value.startsWith('midi:') ? select.value.slice(5) : '';
                    midiOutput = Array.from(midiAccessHandle.outputs.values())
                        .find(output => output.id === outputId && output.state !== 'disconnected') || null;
                    updateMIDIStatus(!!midiOutput);
                    if (midiOutput) {
                        state.midi.device = midiOutput.name;
                        saveState();
                    }
                });

                midiAccessHandle.onstatechange = event => {
                    recordDiagnosticEvent('midi_device_state', {
                        id: event.port.id,
                        name: event.port.name,
                        type: event.port.type,
                        state: event.port.state,
                        connection: event.port.connection
                    });
                    refreshMIDIOutputs();
                };
                refreshMIDIOutputs();
            } catch (err) {
                console.error('Web MIDI error:', err);
                if (!isBridgeConnected) {
                    document.getElementById('midi-status-text').textContent = t('webMidiNotSupported');
                    updateOperatorHealth();
                }
            }
        }

        function updateMIDIStatus(connected, isBridge = false) {
            const dot = document.getElementById('midi-dot');
            const txt = document.getElementById('midi-status-text');
            dot.className = 'dot' + (connected ? ' connected' : '');
            if (isBridge && connected) {
                txt.textContent = t('bridgeConnected');
            } else {
                txt.textContent = connected ? t('connected') : t('disconnected');
            }
            updateOperatorHealth();
        }

        function setHealthChip(id, text, status) {
            const chip = document.getElementById(id);
            if (!chip) return;
            chip.textContent = text;
            chip.dataset.state = status;
        }

        function updateOperatorHealth() {
            const bridgeConnecting = isBridgeHost && wsBridge && wsBridge.readyState === WebSocket.CONNECTING;
            if (isBridgeHost && isBridgeConnected) {
                setHealthChip('bridge-health', t('bridgeOnline'), 'ok');
            } else if (bridgeConnecting) {
                setHealthChip('bridge-health', t('bridgeConnecting'), 'busy');
            } else if (isBridgeHost) {
                setHealthChip('bridge-health', t('bridgeOffline'), 'error');
            } else {
                setHealthChip('bridge-health', t('directMode'), midiOutput ? 'ok' : '');
            }

            const pedalConnected = isBridgeHost ?
                (isBridgeConnected && isBridgeToneXConnected) : !!midiOutput;
            setHealthChip('pedal-health', pedalConnected ? t('pedalOnline') : t('pedalOffline'), pedalConnected ? 'ok' : 'error');

            const libraryKeys = {
                empty: 'libraryEmpty',
                cached: 'libraryCached',
                syncing: 'librarySyncing',
                current: 'libraryCurrent',
                stale: 'libraryStale'
            };
            const libraryStates = {
                empty: '',
                cached: '',
                syncing: 'busy',
                current: 'ok',
                stale: 'error'
            };
            setHealthChip('library-health', t(libraryKeys[libraryFreshness]), libraryStates[libraryFreshness]);
        }

        function updatePresetCommandStatus() {
            const el = document.getElementById('preset-command-status');
            if (!el) return;

            const status = presetCommandState.commandStatus;
            const targetPc = presetCommandState.pending ? presetCommandState.pending.pc : presetCommandState.lastRequestedPc;
            const messages = {
                queued: 'presetQueued',
                waiting: 'presetWaiting',
                confirmed: 'presetConfirmed',
                timed_out: 'presetTimedOut',
                failed: 'presetSendFailed',
                unconfirmed: 'presetUnconfirmed'
            };

            if (status === 'idle') {
                el.textContent = '';
                el.dataset.state = '';
            } else if (status === 'disconnected') {
                el.textContent = t('presetDisconnected');
                el.dataset.state = 'error';
            } else {
                el.textContent = formatPresetMessage(messages[status], targetPc);
                el.dataset.state = status === 'confirmed' ? 'confirmed' :
                    (status === 'queued' || status === 'waiting' ? 'pending' : 'error');
            }
        }

        // --- Library ---
        function renderLibrary() {
            const container = document.getElementById('preset-list');
            const search = document.getElementById('search-box').value.toLowerCase();
            container.innerHTML = '';

            for (let bank = 0; bank < TOTAL_BANKS; bank++) {
                const group = document.createElement('div');
                group.className = 'bank-group';

                const label = document.createElement('div');
                label.className = 'bank-label';
                label.textContent = t('bankLabel') + String(bank).padStart(2, '0');
                group.appendChild(label);

                let bankHasVisible = false;

                for (const slot of SLOTS) {
                    const pc = pcFromBankSlot(bank, slot);
                    const info = getPresetInfo(bank, slot);
                    const display = String(bank).padStart(2, '0') + slot;

                    if (search && !info.name.toLowerCase().includes(search) && !display.includes(search)) {
                        continue;
                    }

                    bankHasVisible = true;

                    const row = document.createElement('div');
                    row.className = 'preset-row';
                    row.tabIndex = 0;
                    row.setAttribute('role', 'button');
                    if (pc === activePresetPC) {
                        row.classList.add('active');
                        if (presetCommandState.activeFreshness === 'stale') row.classList.add('stale');
                    }
                    if (presetCommandState.pending && pc === presetCommandState.pending.pc) row.classList.add('pending');
                    if (!presetCommandState.pending &&
                        ['unconfirmed', 'timed_out', 'failed'].includes(presetCommandState.commandStatus) &&
                        pc === presetCommandState.lastRequestedPc) row.classList.add('requested');
                    row.draggable = !stageModeActive;
                    row.dataset.source = 'library';
                    row.dataset.bank = bank;
                    row.dataset.slot = slot;
                    row.dataset.pc = pc;

                    row.addEventListener('click', () => {
                        bankSelectAndPC(bank, slot);
                    });

                    row.addEventListener('keydown', (e) => {
                        if (e.key !== 'Enter' && e.key !== ' ') return;
                        e.preventDefault();
                        bankSelectAndPC(bank, slot);
                    });

                    row.addEventListener('dblclick', (e) => {
                        e.preventDefault();
                        if (stageModeActive) return;
                        openEditModal('library', bank, slot);
                    });

                    row.addEventListener('dragstart', (e) => {
                        if (stageModeActive) {
                            e.preventDefault();
                            return;
                        }
                        e.dataTransfer.setData('text/plain', JSON.stringify({
                            source: 'library',
                            bank: bank,
                            slot: slot
                        }));
                        e.dataTransfer.effectAllowed = 'move';
                        row.classList.add('dragging');
                        setTimeout(() => row.classList.remove('dragging'), 0);
                    });

                    row.addEventListener('dragend', () => row.classList.remove('dragging'));

                    const slotEl = document.createElement('span');
                    slotEl.className = 'preset-slot';
                    slotEl.textContent = slot;

                    const nameEl = document.createElement('span');
                    nameEl.className = 'preset-name';
                    nameEl.textContent = info.name;

                    const badges = document.createElement('span');
                    badges.className = 'preset-badges';

                    const ampBadge = document.createElement('span');
                    ampBadge.className = 'badge ' + (info.amp ? 'amp-on' : 'amp-off');
                    ampBadge.textContent = 'AMP';
                    badges.appendChild(ampBadge);

                    const cabBadge = document.createElement('span');
                    cabBadge.className = 'badge ' + (info.cab ? 'cab-on' : 'cab-off');
                    cabBadge.textContent = 'CAB';
                    badges.appendChild(cabBadge);

                    row.appendChild(slotEl);
                    row.appendChild(nameEl);
                    row.appendChild(badges);
                    group.appendChild(row);
                }

                if (bankHasVisible) {
                    container.appendChild(group);
                }
            }
        }

        // --- Grid ---
        function renderGrid() {
            const grid = document.getElementById('preset-grid');
            grid.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'grid-btn';
                btn.dataset.slotIndex = i;
                btn.dataset.pad = String(i + 1).padStart(2, '0');

                const assigned = state.buttons[i];

                if (assigned) {
                    const info = getPresetInfo(assigned.bank, assigned.slot);
                    const assignedPc = pcFromBankSlot(assigned.bank, assigned.slot);
                    btn.innerHTML =
                        '<span class="btn-slot">' + String(assigned.bank).padStart(2,'0') + assigned.slot + '</span>' +
                        '<span class="btn-name">' + escapeHtml(info.name) + '</span>' +
                        '<span class="btn-badges">' +
                            '<span class="badge ' + (info.amp ? 'amp-on' : 'amp-off') + '">AMP</span>' +
                            '<span class="badge ' + (info.cab ? 'cab-on' : 'cab-off') + '">CAB</span>' +
                        '</span>';

                    btn.classList.remove('empty');
                    if (assignedPc === activePresetPC) {
                        btn.classList.add('active');
                        if (presetCommandState.activeFreshness === 'stale') btn.classList.add('stale');
                    }
                    if (presetCommandState.pending && assignedPc === presetCommandState.pending.pc) btn.classList.add('pending');
                    if (!presetCommandState.pending &&
                        ['unconfirmed', 'timed_out', 'failed'].includes(presetCommandState.commandStatus) &&
                        assignedPc === presetCommandState.lastRequestedPc) btn.classList.add('requested');
                    btn.draggable = !stageModeActive;
                    btn.setAttribute('aria-label', `Pad ${i + 1}: ${String(assigned.bank).padStart(2, '0')}${assigned.slot}, ${info.name}`);

                    btn.addEventListener('click', (e) => {
                        if (justDragged) return;
                        bankSelectAndPC(assigned.bank, assigned.slot);
                    });

                    btn.addEventListener('dblclick', (e) => {
                        e.preventDefault();
                        if (stageModeActive) return;
                        openEditModal('grid', null, null, i);
                    });

                    btn.addEventListener('dragstart', (e) => {
                        if (stageModeActive) {
                            e.preventDefault();
                            return;
                        }
                        e.dataTransfer.setData('text/plain', JSON.stringify({
                            source: 'grid',
                            buttonIndex: i,
                            bank: assigned.bank,
                            slot: assigned.slot
                        }));
                        e.dataTransfer.effectAllowed = 'move';
                        btn.style.opacity = '0.4';
                        setTimeout(() => btn.style.opacity = '', 0);
                    });

                    btn.addEventListener('dragend', () => btn.style.opacity = '');

                } else {
                    btn.classList.add('empty');
                    btn.tabIndex = -1;
                    btn.innerHTML = '<span class="empty-label">' + t('empty') + '</span>';
                }

                btn.addEventListener('dragover', (e) => {
                    if (stageModeActive) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    btn.classList.add('drag-over');
                });

                btn.addEventListener('dragleave', () => btn.classList.remove('drag-over'));

                btn.addEventListener('drop', (e) => {
                    if (stageModeActive) return;
                    e.preventDefault();
                    btn.classList.remove('drag-over');
                    try {
                        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                        handleDrop(data, i);
                    } catch(err) {}
                });

                grid.appendChild(btn);
            }
        }

        function handleDrop(data, targetIndex) {
            if (stageModeActive) return;
            justDragged = true;
            setTimeout(() => justDragged = false, 100);
            if (data.source === 'library') {
                state.buttons[targetIndex] = { bank: data.bank, slot: data.slot };
                saveState();
                renderGrid();
                renderLibrary();
            } else if (data.source === 'grid') {
                const sourceIndex = data.buttonIndex;
                if (sourceIndex === targetIndex) return;

                const targetData = state.buttons[targetIndex];
                const sourceData = state.buttons[sourceIndex];

                if (targetData) {
                    state.buttons[sourceIndex] = targetData;
                    state.buttons[targetIndex] = sourceData;
                } else {
                    state.buttons[targetIndex] = sourceData;
                    delete state.buttons[sourceIndex];
                }
                saveState();
                renderGrid();
                renderLibrary();
            }
        }

        // --- Trash ---
        function initTrash() {
            const trash = document.getElementById('trash-zone');

            trash.addEventListener('dragover', (e) => {
                if (stageModeActive) return;
                e.preventDefault();
                try {
                    const raw = e.dataTransfer.types.includes('text/plain');
                    if (raw) {
                        e.dataTransfer.dropEffect = 'move';
                        trash.classList.add('drag-over');
                    }
                } catch(err) {}
            });

            trash.addEventListener('dragleave', () => trash.classList.remove('drag-over'));

            trash.addEventListener('drop', (e) => {
                if (stageModeActive) return;
                e.preventDefault();
                trash.classList.remove('drag-over');
                try {
                    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                    if (data.source === 'grid') {
                        delete state.buttons[data.buttonIndex];
                        saveState();
                        renderGrid();
                    }
                } catch(err) {}
            });
        }
